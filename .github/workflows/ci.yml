name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    # اختبارات العزل بين المنشآت: لا دمج إن فشلت.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: haseef_owner, POSTGRES_PASSWORD: dev, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U haseef_owner" --health-interval 3s --health-retries 20
    env: { PGHOST: localhost, PGUSER: haseef_owner, PGPASSWORD: dev, DB: haseef_test }
    steps:
      - uses: actions/checkout@v4
      - run: db/tests/run.sh
      - run: python3 db/tests/sql_static_check.py apps/api/haseef

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm install
      - run: npm test -w @haseef/shared
      - run: npm run typecheck
      - run: npm run build
