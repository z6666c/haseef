[project]
name = "haseef-api"
version = "0.1.0"
description = "Haseef GRC platform — API, workers and AI engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["haseef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
